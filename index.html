<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scratch2Build Week 2 - Diagnostic Mini-Task</title>
  <style>
    /* ==========================================================================
       1. UNIVERSAL RESET (Standard Practice)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a; /* Dark background */
      color: #334155;
    }

    /* ==========================================================================
       🚨 PARENT OVERLAY (OVERVIEW OF BUGS & FLEXBOX SOLUTIONS)
       ========================================================================== */
    .modal-overlay {
      background-color: rgba(15, 23, 42, 0.75);
      min-height: 100vh;
      width: 100%;    
      margin-top: 0;
      margin-left: 0;
      
    }

    /* ==========================================================================
       MODAL CARD CONTAINER
       ========================================================================== */
    .modal-card {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.2);
    }

    .modal-card h2 {
      color: #0f172a;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-card p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* ==========================================================================
       🚨 ACTION BUTTONS FOOTER
       ========================================================================== */
    .modal-actions {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;

      /* ❌ BROKEN INITIAL CODE (Fixed margin pushes buttons outside the modal!): */
      margin-left: 350px;
      white-space: nowrap;

      /* ✅ FLEXBOX SOLUTION (Uncomment these 3 lines and remove margin-left above):
      display: flex;
      justify-content: flex-end; /* Aligns buttons cleanly to the right edge */
      gap: 12px;                 /* Dynamic gap between action buttons */
      margin-left: 0;
      */
    }

    /* ==========================================================================
       BUTTON STYLES
       ========================================================================== */
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s ease;
    }

    .btn-secondary {
      background-color: #f1f5f9;
      color: #475569;
    }

    .btn-secondary:hover {
      background-color: #e2e8f0;
    }

    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>
<body>

  <!-- PARENT 1: OVERLAY CONTAINER -->
  <div class="modal-overlay">
    
    <!-- CHILD: MODAL CARD -->
    <div class="modal-card">
      <h2>Delete Activity Project?</h2>
      <p>Are you sure you want to remove this project from the FCAI Activity Portal? This action cannot be undone and will erase all associated submission logs.</p>
      
      <!-- PARENT 2: ACTIONS FOOTER CONTAINER -->
      <div class="modal-actions">
        <button class="btn btn-secondary" type="button">Cancel</button>
        <button class="btn btn-primary" type="button">Confirm Delete</button>
      </div>

    </div>

  </div>

</body>
</html>
